[workspace]
resolver = "3"
members = ["crates/annorex-hosts", "crates/annorex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/devararishivian/annorex"

[workspace.dependencies]
annorex-hosts = { path = "crates/annorex-hosts" }
clap = { version = "4.6.7", features = ["derive"] }
insta = "1.49.0"
jiff = "0.2.41"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
unicode-width = "0.2.3"

# Lint table derived from plannotator-tui (MIT).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
strip = true
