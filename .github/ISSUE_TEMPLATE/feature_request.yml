name: Feature request
description: Ask for a new feature or a change.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe what you want to do and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you want
      description: Describe how Annorex can solve the problem.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Select the agent that the request applies to.
      options:
        - Claude Code
        - Pi
        - OpenCode
        - All agents
        - Not related to an agent
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways to solve it
      description: Describe any other solution that you tried or considered.
    validations:
      required: false
